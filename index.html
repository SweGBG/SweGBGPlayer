<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweGBGPlayer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Title Bar -->
  <div id="titlebar">
    <div id="titlebar-left">
      <svg class="app-icon" viewBox="0 0 24 24" width="18" height="18">
        <circle cx="12" cy="12" r="10" fill="#e94560" opacity="0.9"/>
        <polygon points="10,7 17,12 10,17" fill="white"/>
      </svg>
      <button class="menu-btn" id="menu-file">File</button>
      <button class="menu-btn" id="menu-playback">Playback</button>
      <button class="menu-btn" id="menu-subtitles">Subtitles</button>
      <button class="menu-btn" id="menu-extensions">Extensions</button>
    </div>
    <div id="titlebar-drag">
      <span id="title-text">SweGBGPlayer</span>
    </div>
    <div id="titlebar-buttons">
      <button id="btn-minimize" title="Minimize">&#x2014;</button>
      <button id="btn-maximize" title="Maximize">&#x25A1;</button>
      <button id="btn-close" title="Close">&#x2715;</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="app">
    <!-- Sidebar / Playlist -->
    <div id="sidebar" class="hidden">
      <div class="sidebar-header">
        <h3>Playlist</h3>
        <button id="btn-close-sidebar" title="Close">&#x2715;</button>
      </div>
      <div id="playlist"></div>
      <div class="sidebar-actions">
        <button id="btn-add-files">+ Add Files</button>
        <button id="btn-add-folder">+ Add Folder</button>
      </div>
    </div>

    <!-- Video Area -->
    <div id="video-container">
      <div id="drop-zone">
        <div class="drop-content">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <circle cx="40" cy="40" r="38" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="8 4"/>
            <polygon points="32,24 58,40 32,56" fill="#e94560" opacity="0.8"/>
          </svg>
          <p>Drop media files here or click to open</p>
          <span class="hint">Supports MP4, WebM, MKV, AVI, MOV, MP3, WAV, OGG and more</span>
        </div>
      </div>
      <video id="video-player"></video>
      <div id="subtitle-overlay"></div>
    </div>

    <!-- Subtitle Download Panel -->
    <div id="subtitle-panel" class="hidden">
      <div class="panel-header">
        <h3>Download Subtitles</h3>
        <button id="btn-close-sub-panel">&#x2715;</button>
      </div>
      <div class="sub-search-bar">
        <input type="text" id="sub-search-input" placeholder="Search by movie name...">
        <select id="sub-language">
          <option value="eng">English</option>
          <option value="swe">Swedish</option>
          <option value="spa">Spanish</option>
          <option value="fre">French</option>
          <option value="ger">German</option>
          <option value="ita">Italian</option>
          <option value="por">Portuguese</option>
          <option value="dut">Dutch</option>
          <option value="pol">Polish</option>
          <option value="rum">Romanian</option>
          <option value="tur">Turkish</option>
          <option value="ara">Arabic</option>
          <option value="chi">Chinese</option>
          <option value="jpn">Japanese</option>
          <option value="kor">Korean</option>
          <option value="rus">Russian</option>
          <option value="heb">Hebrew</option>
          <option value="hin">Hindi</option>
          <option value="nor">Norwegian</option>
          <option value="dan">Danish</option>
          <option value="fin">Finnish</option>
        </select>
        <button id="btn-search-subs">Search</button>
        <button id="btn-hash-search" title="Search by file hash (more accurate)">Hash Search</button>
      </div>
      <div id="sub-status"></div>
      <div id="sub-results"></div>
    </div>

    <!-- Music Grabber Extension Panel -->
    <div id="grabber-panel" class="hidden">
      <div class="panel-header">
        <h3>Music Grabber</h3>
        <button id="btn-close-grabber-panel">&#x2715;</button>
      </div>
      <div class="grabber-input-bar">
        <input type="text" id="grabber-url" placeholder="Paste video/song URL...">
        <select id="grabber-format">
          <option value="mp3" selected>MP3 (audio)</option>
          <option value="mp4">MP4 (video)</option>
        </select>
        <button id="btn-grabber-download">Download</button>
      </div>
      <div class="grabber-folder-bar">
        <span id="grabber-dir" title=""></span>
        <button id="btn-grabber-choose-dir" title="Change download folder">Folder...</button>
        <button id="btn-grabber-open-dir" title="Open download folder">Open</button>
      </div>
      <div id="grabber-status"></div>
      <div id="grabber-jobs"></div>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div id="progress-container">
      <div id="progress-bar">
        <div id="progress-buffered"></div>
        <div id="progress-played"></div>
        <div id="progress-handle"></div>
      </div>
      <div id="progress-tooltip">0:00</div>
    </div>
    <div id="controls-row">
      <div class="controls-left">
        <button id="btn-prev" title="Previous">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" title="Play">
          <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28"><polygon fill="currentColor" points="6,4 20,12 6,20"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="28" height="28" style="display:none"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button id="btn-stop" title="Stop">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button id="btn-next" title="Next">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 6h2v12h-2zm-3.5 6L4 6v12z" transform="scale(-1,1) translate(-24,0)"/></svg>
        </button>
        <button id="btn-history" title="History mode: prev/next navigates play history">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </button>
        <span id="time-display">0:00 / 0:00</span>
      </div>
      <div class="controls-center">
        <span id="now-playing"></span>
      </div>
      <div class="controls-right">
        <button id="btn-subtitle" title="Subtitles">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z"/></svg>
        </button>
        <button id="btn-sub-download" title="Download Subtitles">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
        <div id="volume-container">
          <button id="btn-volume" title="Volume">
            <svg id="icon-vol" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="icon-mute" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <select id="speed-select" title="Playback Speed">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2">2x</option>
        </select>
        <button id="btn-playlist" title="Playlist">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        </button>
        <button id="btn-fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
